<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Finance Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/market.css">
  <link rel="stylesheet" href="/css/charts.css">
  <link rel="stylesheet" href="/css/stage2c.css">
  <link rel="stylesheet" href="/css/stage2d.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <div id="app">

    <!-- Sidebar Nav -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">⬡</span>
        <span class="logo-text">FINHUB</span>
      </div>
      <ul class="nav-links">
        <li><a href="#" data-page="dashboard" class="nav-link active">
          <span class="nav-icon">◈</span><span class="nav-label">Dashboard</span>
        </a></li>
        <li><a href="#" data-page="trades" class="nav-link">
          <span class="nav-icon">◇</span><span class="nav-label">Trade Journal</span>
        </a></li>
        <li><a href="#" data-page="checkbook" class="nav-link">
          <span class="nav-icon">◻</span><span class="nav-label">Checkbook</span>
        </a></li>
        <li><a href="#" data-page="credit" class="nav-link">
          <span class="nav-icon">▣</span><span class="nav-label">Credit</span>
        </a></li>
        <li><a href="#" data-page="market" class="nav-link">
          <span class="nav-icon">◉</span><span class="nav-label">Market</span>
        </a></li>
        <li><a href="#" data-page="stocks" class="nav-link">
          <span class="nav-icon">◈</span><span class="nav-label">Stocks</span>
        </a></li>
        <li><a href="#" data-page="charts" class="nav-link">
          <span class="nav-icon">╱</span><span class="nav-label">Analytics</span>
        </a></li>
        <li><a href="#" data-page="gambling" class="nav-link">
          <span class="nav-icon">◈</span><span class="nav-label">Gambling</span>
        </a></li>
        <li><a href="#" data-page="tools" class="nav-link">
          <span class="nav-icon">⊕</span><span class="nav-label">Tools</span>
        </a></li>
        <li><a href="#" data-page="notes" class="nav-link">
          <span class="nav-icon">≡</span><span class="nav-label">Journal</span>
        </a></li>
        <li><a href="#" data-page="settings" class="nav-link">
          <span class="nav-icon">⊙</span><span class="nav-label">Settings</span>
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <span class="version">v2.0 — Stage 2</span>
        <button class="btn btn-ghost btn-sm" style="margin-top:10px;width:100%" onclick="logOut()">Sign Out</button>
      </div>
    </nav>

    <!-- Mobile bottom nav -->
    <nav id="mobile-nav">
      <a href="#" data-page="dashboard" class="mob-link active">
        <span class="mob-icon">◈</span>
        <span>Home</span>
      </a>
      <a href="#" data-page="trades" class="mob-link">
        <span class="mob-icon">◇</span>
        <span>Trades</span>
      </a>
      <a href="#" data-page="market" class="mob-link">
        <span class="mob-icon">◉</span>
        <span>Market</span>
      </a>
      <a href="#" data-page="charts" class="mob-link">
        <span class="mob-icon">╱</span>
        <span>Charts</span>
      </a>
      <a href="#" data-page="settings" class="mob-link">
        <span class="mob-icon">⊙</span>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Hamburger for mobile -->
    <button id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <!-- Main content -->
    <main id="main-content">
      <div id="page-dashboard" class="page active"></div>
      <div id="page-trades" class="page"></div>
      <div id="page-checkbook" class="page"></div>
      <div id="page-credit" class="page"></div>
      <div id="page-market" class="page"></div>
      <div id="page-stocks" class="page"></div>
      <div id="page-charts" class="page"></div>
      <div id="page-gambling" class="page"></div>
      <div id="page-tools" class="page"></div>
      <div id="page-notes" class="page"></div>
      <div id="page-settings" class="page"></div>
    </main>

  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <button id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Scripts — order matters -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/chart-engine.js"></script>
  <script src="/js/modules/dashboard.js"></script>
  <script src="/js/modules/trades.js"></script>
  <script src="/js/modules/checkbook.js"></script>
  <script src="/js/modules/credit.js"></script>
  <script src="/js/modules/market.js"></script>
  <script src="/js/modules/gambling.js"></script>
  <script src="/js/modules/notes.js"></script>
  <script src="/js/modules/settings.js"></script>
  <script src="/js/modules/tools.js"></script>
  <script src="/js/modules/charts-view.js"></script>
  <script src="/js/modules/stocks.js"></script>
  <script src="/js/app.js"></script>
